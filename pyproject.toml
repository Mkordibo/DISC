[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disc-watermark"
version = "0.1.0"
description = "Reference implementation of Distribution Interval Shift Coding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.38"]
dev = ["pytest>=8", "ruff>=0.6"]
experiments = ["matplotlib>=3.8"]

[project.scripts]
disc-simulate = "disc.cli:main"

[tool.setuptools.packages.find]
include = ["disc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
